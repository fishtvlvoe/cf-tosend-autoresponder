# 好寄（Hokya）一鍵部署 workflow
# 學員操作：GitHub repo → Settings → Secrets → 設三個 Secrets → 按 Actions → Deploy
#
# 前置（僅首次，純網頁 30 秒）：
#   Cloudflare Dashboard → D1 → Create database → 命名「autoresponder_db」
#   把 database_id 填進 wrangler.jsonc
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wrangler
        run: npm install --global wrangler

      # 首次部署後以 wrangler secret put HAOJI_SECRET 設定（本機一次即可，之後不用再動）
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
